services:
  - type: web
    name: aurelie-earrings
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && cd ../frontend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_xP2dwOcoQTb8@ep-spring-moon-b5qaw68i.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_SUPER_ADMIN_EMAIL
        value: admin@aurelie.local
      - key: SEED_SUPER_ADMIN_PASSWORD
        value: admin@123
